# The URL the site will be built for
base_url = "https://www.mheister.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

taxonomies = [
    { name = "tags", paginate_by = 4 }
]

[markdown.highlighting]
# Render colors via CSS classes instead of inline styles, so a light/dark
# stylesheet can be picked with prefers-color-scheme
style = "class"
light_theme = "one-light"
dark_theme = "one-dark-pro"
# Fail the build on a code fence with an unknown language instead of silently
# rendering it as plain text
error_on_missing_language = true

[extra]
# Put all your custom variables here
